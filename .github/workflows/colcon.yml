name: colcon

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy]
    container:
      image: ros:${{ matrix.distro }}-ros-base
    steps:
      - uses: actions/checkout@v4

      - name: Verify delivered files and contract
        run: python3 tools/check_interface.py

      - name: Install build tools and dependencies
        shell: bash
        run: |
          set -eo pipefail
          apt-get update
          apt-get install -y --no-install-recommends python3-colcon-common-extensions python3-rosdep
          rosdep update --rosdistro ${{ matrix.distro }}
          source /opt/ros/${{ matrix.distro }}/setup.bash
          rosdep install --from-paths control_interfaces examples --ignore-src -y --rosdistro ${{ matrix.distro }}

      - name: Require the three delivered ROS packages
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/${{ matrix.distro }}/setup.bash
          colcon list --base-paths control_interfaces examples --names-only | sort > /tmp/packages.txt
          printf '%s\n' control_interfaces control_listener_pkg control_node_pkg | sort > /tmp/expected-packages.txt
          diff -u /tmp/expected-packages.txt /tmp/packages.txt

      - name: Build
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/${{ matrix.distro }}/setup.bash
          colcon build --base-paths control_interfaces examples --event-handlers console_direct+ --cmake-args -DCMAKE_BUILD_TYPE=Release

      - name: Test C++ example delivery
        shell: bash
        env:
          ROS_LOCALHOST_ONLY: "1"
        run: |
          set -eo pipefail
          source /opt/ros/${{ matrix.distro }}/setup.bash
          source install/setup.bash
          colcon test --base-paths control_interfaces examples --return-code-on-test-failure --event-handlers console_direct+
          colcon test-result --verbose

      - name: Retain test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colcon-${{ matrix.distro }}-logs
          path: log/
          if-no-files-found: ignore
